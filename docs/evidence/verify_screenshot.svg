<text x="20" y="340" xml:space="preserve" fill="#e6edf3"><tspan fill="#39c5cf" font-weight="600">== 3. curated reproducers under ASAN/UBSAN ==</tspan></text>
<text x="20" y="362" xml:space="preserve" fill="#e6edf3">  <tspan fill="#3fb950" font-weight="600">PASS</tspan> BUG1 stack overflow (cmd_auth)</text>
