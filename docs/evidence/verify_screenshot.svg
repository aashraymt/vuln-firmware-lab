<text x="20" y="494" xml:space="preserve" fill="#e6edf3"><tspan fill="#39c5cf" font-weight="600">== 4. exploit — stack smash pops a shell ==</tspan></text>
<text x="20" y="516" xml:space="preserve" fill="#e6edf3">  <tspan fill="#3fb950" font-weight="600">PASS</tspan> exploit popped shell: <tspan fill="#d29922" font-weight="600">uid=0(root) gid=0(root) groups=0(root)</tspan></text>
